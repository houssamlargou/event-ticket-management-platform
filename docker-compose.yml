services:
  app:
    build: .
    container_name: etm_app
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    ports:
      - "8002:8000"
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: etm_db
    restart: always
    environment:
      POSTGRES_DB: etm_db
      POSTGRES_USER: etm_user
      POSTGRES_PASSWORD: 0000
    volumes:
      - db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: etm_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: houssam@admin.com
      PGADMIN_DEFAULT_PASSWORD: walo@1234
    ports:
      - "5052:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  db_data:
  pgadmin_data: